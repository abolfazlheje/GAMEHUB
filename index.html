```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMEHUB - مرکز گیمینگ</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #08070d;
  color: white;
  min-height: 100vh;
}

header {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  border-bottom: 1px solid #25202c;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  direction: ltr;
}

.logo span {
  color: #a64cff;
}

.menu {
  font-size: 38px;
  cursor: pointer;
}

main {
  width: 92%;
  max-width: 1100px;
  margin: auto;
}

.hero {
  text-align: center;
  padding: 45px 15px 25px;
}

.hero h1 {
  font-size: 48px;
  margin-bottom: 20px;
}

.hero h1 span {
  color: #a64cff;
}

.hero p {
  color: #aaa;
  font-size: 22px;
}

/* SEARCH */

.search-box {
  margin: 35px auto;
  max-width: 700px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 20px 60px 20px 20px;
  border-radius: 35px;
  border: 1px solid #a64cff;
  background: #100d16;
  color: white;
  font-size: 20px;
  outline: none;
  text-align: right;
}

.search-box input:focus {
  box-shadow: 0 0 20px rgba(166,76,255,.25);
}

.search-icon {
  position: absolute;
  right: 20px;
  top: 15px;
  font-size: 28px;
}

/* CATEGORIES */

.categories {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin: 25px 0 40px;
}

.category {
  border: 1px solid #30243d;
  background: #0c0a10;
  color: #aaa;
  border-radius: 35px;
  padding: 15px 30px;
  font-size: 18px;
  cursor: pointer;
  transition: .2s;
}

.category:hover,
.category.active {
  background: #7929b8;
  border-color: #a64cff;
  color: white;
}

/* ADVERTISEMENT PLACE */

.ad-box {
  max-width: 728px;
  min-height: 100px;
  margin: 25px auto 45px;
  border: 1px dashed #4a3b55;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  font-size: 15px;
}

.ad-box span {
  text-align: center;
}

/* GAMES */

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  padding-bottom: 60px;
}

.game-card {
  background: #100d15;
  border: 1px solid #211a29;
  border-radius: 20px;
  padding: 25px;
  cursor: pointer;
  transition: .25s;
}

.game-card:hover {
  transform: translateY(-5px);
  border-color: #9d45ef;
  box-shadow: 0 10px 30px rgba(157,69,239,.12);
}

.game-icon {
  font-size: 65px;
  text-align: center;
  margin-bottom: 15px;
}

.game-card h2 {
  text-align: center;
  margin-bottom: 10px;
}

.genre {
  color: #b05cff;
  text-align: center;
  margin-bottom: 12px;
}

.description {
  color: #bbb;
  line-height: 1.9;
  text-align: center;
}

.rating {
  color: #ffd43b;
  text-align: center;
  font-size: 20px;
  margin-top: 15px;
}

.no-results {
  text-align: center;
  color: #999;
  font-size: 20px;
  padding: 40px;
  display: none;
}

/* GAME PAGE */

.game-page {
  position: fixed;
  inset: 0;
  background: #09080e;
  overflow-y: auto;
  z-index: 9999;
  padding: 30px 20px 60px;
}

.game-page-inner {
  max-width: 700px;
  margin: auto;
  text-align: center;
}

.close-button {
  position: fixed;
  top: 20px;
  left: 20px;
  border: none;
  background: #241b2b;
  color: white;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 25px;
  cursor: pointer;
}

.big-icon {
  font-size: 90px;
  margin-top: 30px;
}

.game-page h1 {
  font-size: 48px;
  margin: 20px 0;
}

.game-page-rating {
  color: #ffd43b;
  font-size: 35px;
  margin: 20px;
}

.game-description {
  color: #ccc;
  font-size: 22px;
  line-height: 2;
  margin: 30px 0;
}

.info-box {
  background: #130e18;
  border-radius: 20px;
  padding: 25px;
  margin: 20px 0;
}

.info-box div {
  padding: 18px;
  border-bottom: 1px solid #2a202f;
}

.info-box div:last-child {
  border-bottom: none;
}

.info-box strong {
  color: #a64cff;
  display: block;
  margin-bottom: 8px;
}

.play-button,
.back-button {
  width: 100%;
  padding: 20px;
  border: none;
  border-radius: 25px;
  font-size: 23px;
  cursor: pointer;
  margin-top: 15px;
}

.play-button {
  background: #a64cff;
  color: white;
}

.play-button:hover {
  background: #8d35d8;
}

.back-button {
  background: #211926;
  color: white;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 30px;
  border-top: 1px solid #211c26;
  color: #777;
}

/* MOBILE */

@media (max-width: 600px) {

  header {
    height: 75px;
    padding: 0 20px;
  }

  .logo {
    font-size: 25px;
  }

  .menu {
    font-size: 32px;
  }

  .hero {
    padding-top: 30px;
  }

  .hero h1 {
    font-size: 38px;
  }

  .hero p {
    font-size: 18px;
  }

  .category {
    padding: 13px 23px;
  }

  .game-page h1 {
    font-size: 36px;
  }

  .game-description {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">GAME<span>HUB</span></div>
  <div class="menu">☰</div>
</header>

<main>

<section class="hero">
  <h1>بازی‌های <span>محبوب</span></h1>
  <p>بازی مورد علاقه‌ات را پیدا کن</p>
</section>

<!-- SEARCH -->

<div class="search-box">
  <span class="search-icon">🔎</span>

  <input
    id="searchInput"
    type="text"
    placeholder="جست‌وجوی بازی..."
    autocomplete="off"
  >
</div>

<!-- CATEGORIES -->

<div class="categories">

  <button class="category active" data-category="همه">
    همه
  </button>

  <button class="category" data-category="FPS">
    FPS
  </button>

  <button class="category" data-category="RPG">
    RPG
  </button>

  <button class="category" data-category="Sports">
    Sports
  </button>

  <button class="category" data-category="Adventure">
    Adventure
  </button>

</div>

<!-- ADVERTISEMENT PLACE -->

<div class="ad-box">
  <span>
    جایگاه تبلیغات<br>
    <small>پس از فعال‌سازی سرویس تبلیغاتی، کد تبلیغ اینجا قرار می‌گیرد.</small>
  </span>
</div>

<!-- GAMES -->

<section class="games" id="gamesContainer"></section>

<div class="no-results" id="noResults">
  بازی موردنظر پیدا نشد 😕
</div>

</main>

<footer>
  © 2026 GAMEHUB - مرکز گیمینگ
</footer>

<script>

const games = [

  {
    title: "Cyberpunk 2077",
    genre: "RPG",
    rating: "9.2",
    icon: "🎮",
    description:
      "یک ماجراجویی آینده‌نگرانه در شهری پر از فناوری و اتفاقات هیجان‌انگیز.",
    type: "Single Player"
  },

  {
    title: "Call of Duty",
    genre: "FPS",
    rating: "8.9",
    icon: "🎯",
    description:
      "وارد میدان نبرد شو و مهارت‌های خودت را به نمایش بگذار.",
    type: "Multiplayer"
  },

  {
    title: "Minecraft",
    genre: "Adventure",
    rating: "9.0",
    icon: "⛏️",
    description:
      "دنیایی بزرگ برای ساختن، کشف کردن و ماجراجویی.",
    type: "Single Player / Multiplayer"
  },

  {
    title: "FIFA",
    genre: "Sports",
    rating: "8.7",
    icon: "⚽",
    description:
      "تیم خودت را بساز و در مسابقات هیجان‌انگیز فوتبال شرکت کن.",
    type: "Multiplayer"
  },

  {
    title: "The Witcher 3",
    genre: "RPG",
    rating: "9.5",
    icon: "⚔️",
    description:
      "یک ماجراجویی بزرگ در دنیایی فانتزی و پر از داستان.",
    type: "Single Player"
  },

  {
    title: "Fortnite",
    genre: "FPS",
    rating: "8.8",
    icon: "🔫",
    description:
      "در نبردهای آنلاین شرکت کن و برای پیروزی تلاش کن.",
    type: "Multiplayer"
  }

];

const gamesContainer =
  document.getElementById("gamesContainer");

const searchInput =
  document.getElementById("searchInput");

const noResults =
  document.getElementById("noResults");

const categoryButtons =
  document.querySelectorAll(".category");

let selectedCategory = "همه";


/* نمایش بازی‌ها */

function renderGames() {

  const searchText =
    searchInput.value.trim().toLowerCase();

  const filteredGames = games.filter(game => {

    const categoryMatch =
      selectedCategory === "همه" ||
      game.genre === selectedCategory;

    const searchMatch =
      game.title.toLowerCase().includes(searchText) ||
      game.genre.toLowerCase().includes(searchText);

    return categoryMatch && searchMatch;

  });

  gamesContainer.innerHTML = "";

  if (filteredGames.length === 0) {

    noResults.style.display = "block";

    return;
  }

  noResults.style.display = "none";

  filteredGames.forEach((game, index) => {

    const originalIndex =
      games.indexOf(game);

    const card =
      document.createElement("article");

    card.className = "game-card";

    card.dataset.gameIndex =
      originalIndex;

    card.innerHTML = `

      <div class="game-icon">
        ${game.icon}
      </div>

      <h2>${game.title}</h2>

      <div class="genre">
        ${game.genre}
      </div>

      <p class="description">
        ${game.description}
      </p>

      <div class="rating">
        ${game.rating} ⭐
      </div>

    `;

    gamesContainer.appendChild(card);

  });

}


/* جست‌وجو */

searchInput.addEventListener(
  "input",
  renderGames
);


/* دسته‌بندی */

categoryButtons.forEach(button => {

  button.addEventListener("click", () => {

    categoryButtons.forEach(btn =>
      btn.classList.remove("active")
    );

    button.classList.add("active");

    selectedCategory =
      button.dataset.category;

    renderGames();

  });

});


/* باز کردن صفحه بازی */

gamesContainer.addEventListener(
  "click",
  event => {

    const card =
      event.target.closest(".game-card");

    if (!card) return;

    const index =
      Number(card.dataset.gameIndex);

    if (
      Number.isNaN(index) ||
      !games[index]
    ) {
      return;
    }

    openGamePage(games[index]);

  }
);


/* صفحه اختصاصی بازی */

function openGamePage(game) {

  const oldPage =
    document.getElementById("gamePage");

  if (oldPage) {
    oldPage.remove();
  }

  const page =
    document.createElement("div");

  page.className = "game-page";
  page.id = "gamePage";

  page.innerHTML = `

    <button
      class="close-button"
      id="closeGame">
      ✕
    </button>

    <div class="game-page-inner">

      <div class="big-icon">
        ${game.icon}
      </div>

      <h1>
        ${game.title}
      </h1>

      <div class="game-page-rating">
        10 / ${game.rating} ⭐
      </div>

      <p class="game-description">
        ${game.description}
      </p>

      <div class="info-box">

        <div>
          <strong>ژانر</strong>
          <span>${game.genre}</span>
        </div>

        <div>
          <strong>امتیاز</strong>
          <span>10 / ${game.rating}</span>
        </div>

        <div>
          <strong>وضعیت</strong>
          <span>فعال</span>
        </div>

        <div>
          <strong>نوع</strong>
          <span>${game.type}</span>
        </div>

      </div>

      <button
        class="play-button"
        id="playGame">
        🎮 شروع بازی
      </button>

      <button
        class="back-button"
        id="backGame">
        ← بازگشت به بازی‌ها
      </button>

    </div>
  `;

  document.body.appendChild(page);

  document.body.style.overflow =
    "hidden";


  /* بستن صفحه */

  function closePage() {

    const currentPage =
      document.getElementById("gamePage");

    if (currentPage) {
      currentPage.remove();
    }

    document.body.style.overflow =
      "";

  }


  document
    .getElementById("closeGame")
    .addEventListener(
      "click",
      closePage
    );


  document
    .getElementById("backGame")
    .addEventListener(
      "click",
      closePage
    );


  /* دکمه شروع بازی */

  document
    .getElementById("playGame")
    .addEventListener(
      "click",
      () => {

        alert(
          "🎮 بازی " +
          game.title +
          "\n\nلینک اجرای بازی را می‌توانیم در مرحله بعد به این دکمه اضافه کنیم."
        );

      }
    );

}


/* کلید ESC */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      const page =
        document.getElementById(
          "gamePage"
        );

      if (page) {

        page.remove();

        document.body.style.overflow =
          "";

      }

    }

  }
);


/* شروع اولیه */

renderGames();

</script>

</body>
</html>
```

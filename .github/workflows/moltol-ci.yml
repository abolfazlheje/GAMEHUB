name: MOLTOL CI

on:
  push:
    paths:
      - "MOLTOL/**"
      - ".github/workflows/moltol-ci.yml"
  pull_request:
    paths:
      - "MOLTOL/**"
      - ".github/workflows/moltol-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOLTOL
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
